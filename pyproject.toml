[project]
name = "spkproof"
version = "0.3.0"
# This is the sentence PyPI prints under the package name, so it must describe
# the tool rather than the paper. It used to end "...and within-speaker embedding
# displacement", which is the subject of the study spkproof came out of and not
# something this package measures: there is one command, `check-f0`, and no
# displacement check exists. Caught before the first upload.
description = "Deterministic checks for speaker-verification studies: F0-tracking contamination, spectral descriptors that only follow pitch, trial-list design faults, and an encoder panel with paired speaker-bootstrap intervals."
authors = [{name = "Panagiotis (Panos) Gkilis", email = "bedvibe@bedvibe.studio"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["speaker-verification", "speaker-embeddings", "voice-biometrics",
            "f0", "pitch-tracking", "measurement-error", "ECAPA-TDNN", "WavLM",
            "bootstrap", "multiple-comparisons", "equal-error-rate"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

# The core checks deliberately have NO dependencies. They read a CSV a study
# already has and use exact tests implemented in stats.py, so spkproof installs
# and runs anywhere - including on a machine that will never hold the audio.
dependencies = []

[project.optional-dependencies]
# The whole gate has to be installable with the project rather than assumed
# present on the machine that runs it. pyyaml is only used by `scripts/ci.py
# run`, which reads .github/workflows/ci.yml to replay CI locally.
dev = ["pytest", "ruff>=0.16", "mypy>=2.3", "pyyaml>=6", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://ai.bedvibe.studio/speaker-drift/"
Paper = "https://doi.org/10.5281/zenodo.21921958"

[project.scripts]
spkproof = "spkproof.cli:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF013", "S110"]
# Message strings are the tool's output and are asserted in tests; reflowing
# them to satisfy a column limit risks changing behaviour to satisfy a ruler.
ignore = ["E501"]

# This is a src-layout package, and before CI existed a fresh clone could not
# run its own tests: `pytest` collected `tests/test_f0.py`, which imports
# `spkproof`, and failed with ModuleNotFoundError unless the package was
# already installed or PYTHONPATH was set by hand. Nothing in the repository
# said so. `pythonpath` fixes the clone; CI installs the package as well, so
# both paths are exercised.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# spkproof is the newest of the three proof libraries, and when it was 426 lines
# `mypy --strict` reported six errors on it against 159 for trainproof. At six,
# strict was affordable and cheap to keep; it is turned on here and deliberately
# not turned on in the older siblings. Strictness chosen by measurement, not by
# consistency - and kept through 0.3.0, which is now 2,478 lines and still clean.
[tool.mypy]
python_version = "3.10"
files = ["src/spkproof"]
strict = true
