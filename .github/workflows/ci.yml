name: CI

# `workflow_call` matters: release.yml invokes this file rather than repeating
# its steps, so there is exactly one definition of "the gate" and a release can
# never run a weaker one than a pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `ci.py attribution` reads the last 20 commit messages; the default
          # shallow clone of depth 1 would silently scan one commit and pass.
          fetch-depth: 25
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan the tracked tree and recent commits
        run: python scripts/ci.py attribution

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned on purpose. An unpinned linter turns a green repository red on a
      # morning when nobody changed anything. Bumping this is a pull request.
      - name: Install ruff
        run: pip install "ruff==0.16.1"
      - name: Lint
        run: ruff check .

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install "mypy==2.3.1"
      # Strict, unlike the two sibling libraries. That is a measurement, not a
      # preference: `--strict` reported six errors here and 159 on trainproof.
      # See docs/adr/001.
      - name: Type check
        run: mypy

  test:
    name: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must not hide the other seven. Which versions fail is the
      # information a matrix exists to produce.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its dev extra
        run: pip install -e ".[dev]"
      - name: Run the test suite
        run: pytest -q
      # spkproof has no optional dependencies, so there is nothing here that can
      # legitimately skip. A skip means a test that runs in no environment.
      - name: Nothing is skipped
        run: python scripts/ci.py noskips

  clone:
    name: a fresh clone can run its own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # This job exists because of a real defect. spkproof is a src-layout
      # package, and before CI a fresh clone could not run its own tests:
      # `pytest` collected tests/test_f0.py, which imports spkproof, and died
      # with ModuleNotFoundError. Everything above installs the package first
      # and would never have noticed. This installs nothing but pytest.
      - name: Install pytest and nothing else
        run: pip install "pytest>=8"
      - name: Run the suite against the bare checkout
        run: pytest -q

  contract:
    name: published contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e "."
      # The README publishes three exit codes to anyone wiring spkproof into a
      # study pipeline. Unit tests cover the functions; this covers the promise,
      # through the console script.
      - name: Exit-code contract
        run: python scripts/ci.py contract

  package:
    name: build and verify the artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install "build==1.5.1" "twine==6.2.0"
      - name: Versions agree
        run: python scripts/ci.py version
      - name: Build sdist and wheel
        run: python -m build
      - name: Metadata is renderable
        run: twine check dist/*
      # Everything above tests the source tree; this installs the artifact a
      # user would download, into an interpreter with no source directory on
      # its path, and asks it to work.
      - name: Install the wheel into a clean environment and smoke it
        run: python scripts/ci.py wheelcheck
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
